    <style>
      #boot-status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #1f2937;
        font-family:
          Calibri, Carlito, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 15px;
        line-height: 1.45;
        text-align: center;
        background: #f7faf9;
      }

      #boot-status[hidden] {
        display: none;
      }
    </style>
    <script>
      (() => {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .getRegistrations()
            .then((registrations) => registrations.forEach((registration) => registration.unregister()))
            .catch(() => {});
        }

        if ("caches" in window) {
          caches
            .keys()
            .then((keys) => keys.forEach((key) => caches.delete(key)))
            .catch(() => {});
        }
      })();
    </script>
    <script>
      (() => {
        const show = (message) => {
          const boot = document.getElementById("boot-status");
          if (boot) {
            boot.hidden = false;
            boot.textContent = message;
          }
        };

        window.addEventListener("error", (event) => {
          show(`Erreur de chargement: ${event.message}`);
        });
        window.addEventListener("unhandledrejection", (event) => {
          show(`Erreur de chargement: ${event.reason}`);
        });
        window.addEventListener("DOMContentLoaded", () => {
          const app = document.getElementById("app");
          const boot = document.getElementById("boot-status");
          if (!app || !boot) {
            return;
          }

          const hideIfMounted = () => {
            if (app.childElementCount > 0) {
              boot.hidden = true;
            }
          };
          hideIfMounted();
          new MutationObserver(hideIfMounted).observe(app, { childList: true });
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-status">Chargement de rhonometre...</div>
  </body>
