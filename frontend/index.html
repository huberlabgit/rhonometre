<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>rhonometre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link data-trunk rel="css" href="src/styles.css" />
    <link data-trunk rel="copy-dir" href="public" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      #boot-status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #1f2937;
        font-family:
          "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px;
        line-height: 1.45;
        text-align: center;
        background: #f7faf9;
      }

      #boot-status[hidden] {
        display: none;
      }
    </style>
    <script>
      (() => {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .getRegistrations()
            .then((registrations) => registrations.forEach((registration) => registration.unregister()))
            .catch(() => {});
        }

        if ("caches" in window) {
          caches
            .keys()
            .then((keys) => keys.forEach((key) => caches.delete(key)))
            .catch(() => {});
        }
      })();
    </script>
    <script>
      (() => {
        const show = (message) => {
          const boot = document.getElementById("boot-status");
          if (boot) {
            boot.hidden = false;
            boot.textContent = message;
          }
        };

        window.addEventListener("error", (event) => {
          show(`Erreur de chargement: ${event.message}`);
        });
        window.addEventListener("unhandledrejection", (event) => {
          show(`Erreur de chargement: ${event.reason}`);
        });
        window.addEventListener("DOMContentLoaded", () => {
          const app = document.getElementById("app");
          const boot = document.getElementById("boot-status");
          if (!app || !boot) {
            return;
          }

          const hideIfMounted = () => {
            if (app.childElementCount > 0) {
              boot.hidden = true;
            }
          };
          hideIfMounted();
          new MutationObserver(hideIfMounted).observe(app, { childList: true });
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-status">Chargement de rhonometre...</div>
  </body>
</html>
