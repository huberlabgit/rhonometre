[package]
name = "nivrhone-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
base64 = "0.22.1"
calamine = "0.35.0"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3.32"
hex = "0.4.3"
hmac = "0.13.0"
mailparse = "0.16.1"
multer = "3.1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
zip = { version = "7.2.0", default-features = false }
